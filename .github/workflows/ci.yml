name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug,wasm_bindgen_test_runner=trace
  RUST_BACKTRACE: full
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  checkfmt:
    strategy:
      matrix:
        rust:
          # - stable
          - nightly
          - 1.81.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
        # with:
        #   github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - name: Check formatting
        run: |
          rustup component add rustfmt
          # cargo fmt --all -- --check

      # https://stackoverflow.com/questions/64226272/caching-npm-dependency-with-github-action
      - name: Get Yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn config get cacheFolder)"

      # - name: Cache Yarn dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
      #     key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-yarn-

      # - name: Cache NPM dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: '~/.npm'
      #     key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      #     restore-keys: |
      #       ${{ runner.os }}-node-

      - name: Install Node.js dependencies
        working-directory: ./examples/npm_lib
        run: |
          export PATH="/usr/bin:$PATH"  # Ensure system binaries are in PATH
          sudo yarn

      - name: Build with ESBuild script
        working-directory: ./examples/npm_lib
        run: |
          sudo yarn run esbuild

      - name: Install Trunk
        working-directory: ./examples/npm_lib
        run: |
          cargo install --locked trunk

      - name: Build using Trunk
        working-directory: ./examples/npm_lib
        run: |
          RUST_LOG=debug trunk --config ./ build

      # - name: Setup nightly toolchain
      #   run: |
      #     rustup toolchain install nightly
      #     rustup target add wasm32-unknown-unknown --toolchain nightly
      #     rustup show

      - name: Build with Cargo npm_lib
        working-directory: ./examples/npm_lib
        run: |
          # # Note: The `--vers "0.2.100"` must match the version of
          # # `wasm-bindgen` in Cargo.toml file
          # cargo install wasm-bindgen-cli --vers "0.2.100"
          rustup show
          cargo +nightly build --package kobold_npm_lib_example \
            --bin main --target wasm32-unknown-unknown -Zdoctest-xcompile --verbose

      - name: Check package npm_lib
        working-directory: ./examples/npm_lib
        run: |
          cargo check
          cargo fmt --check
      - name: Check parent
        working-directory: ./
        run: |
          cargo check --features serde,stateful --workspace --all-targets --bins --examples
          cargo fmt --check

  miri:
    # needs: [checkfmt]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
        # with:
        #   github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
      - name: Setup Miri
        working-directory: ./
        run: |
          # Source the retry script
          source ./.github/actions/retry-script/retry.sh
          MIRI_NIGHTLY=nightly-$(retry 10 curl -s https://rust-lang.github.io/rustup-components-history/x86_64-unknown-linux-gnu/miri)
          echo "Installing latest nightly with Miri: $MIRI_NIGHTLY"
          rustup set profile minimal
          rustup default "$MIRI_NIGHTLY"
          rustup component add miri
          cargo miri setup
      - name: Run Miri tests
        working-directory: ./crates/kobold
        run: |
          MIRIFLAGS='-Zmiri-strict-provenance' cargo miri test

