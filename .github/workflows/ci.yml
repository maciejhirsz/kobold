name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checkfmt:
    strategy:
      matrix:
        rust:
          - stable
          - nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown
          override: true
      - name: Rust config
        run: |
          rustup set profile minimal
          rustup component add rustfmt
          rustup component add rustfmt --toolchain nightly
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32-unknown-unknown --toolchain nightly
      - name: Check in package
        working-directory: ./examples/npm_lib
        run: |
          # Install Yarn for Node.js
          export PATH="/usr/bin:$PATH"  # Ensure system binaries are in PATH
          npm install -g yarn
          yarn
          yarn run esbuild
          cargo install --locked trunk
          RUST_LOG=debug trunk --config ./ build
          # Note: The `--vers "0.2.100"` must match the version of `wasm-bindgen` in Cargo.toml file
          cargo install wasm-bindgen-cli --vers "0.2.100"
          cargo +nightly build --package kobold_npm_lib_example --bin main --target wasm32-unknown-unknown -Zdoctest-xcompile --verbose
          cargo check
          cargo fmt --check
      - name: Check in parent
        working-directory: ./
        run: |
          cargo check --features serde,stateful --workspace --all-targets --bins --examples
          cargo fmt --check

  miri:
    needs: [checkfmt]
    strategy:
      matrix:
        rust:
          - stable
          - nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: wasm32-unknown-unknown
          override: true
      - name: Setup miri
        run: |
          MIRI_NIGHTLY=nightly-$(curl -s https://rust-lang.github.io/rustup-components-history/x86_64-unknown-linux-gnu/miri)
          echo "Installing latest nightly with Miri: $MIRI_NIGHTLY"
          rustup set profile minimal
          rustup default "$MIRI_NIGHTLY"

          rustup component add miri
          cargo miri setup
      - name: Run miri test
        working-directory: ./crates/kobold
        run: |
          cargo miri test
          MIRIFLAGS='-Zmiri-strict-provenance' cargo miri test

  tests:
    needs: [checkfmt, miri]
    strategy:
      matrix:
        rust:
          #- stable
          - nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          # toolchain: ${{ matrix.rust }}
          toolchain: nightly
          target: wasm32-unknown-unknown
          override: true
      - name: Rust config
        run: |
          rustup set profile minimal
          rustup component add rustfmt
          rustup component add rustfmt --toolchain nightly
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32-unknown-unknown --toolchain nightly
      - name: Test in package npm_lib
        working-directory: ./examples/npm_lib
        run: |
          # Install Yarn for Node.js
          export PATH="/usr/bin:$PATH"  # Ensure system binaries are in PATH
          npm install -g yarn
          yarn
          yarn run esbuild
          cargo install --locked trunk
          RUST_LOG=debug trunk --config ./ build
          # Note: The `--vers "0.2.100"` must match the version of `wasm-bindgen` in Cargo.toml file
          cargo install wasm-bindgen-cli --vers "0.2.100"
          cargo clean
          cargo +nightly test --package kobold_npm_lib_example --bin main --target wasm32-unknown-unknown -Zdoctest-xcompile
