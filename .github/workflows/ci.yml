name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: debug,wasm_bindgen_test_runner=trace
  RUST_BACKTRACE: full
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  checkfmt:
    strategy:
      matrix:
        rust:
          - stable
          - nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
        # with:
        #   github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ matrix.rust }}
      - name: Check in package npm_lib
        working-directory: ./examples/npm_lib
        run: |
          # Install Yarn for Node.js
          export PATH="/usr/bin:$PATH"  # Ensure system binaries are in PATH
          sudo yarn
          sudo yarn run esbuild
          cargo install --locked trunk
          RUST_LOG=debug trunk --config ./ build
          # # Note: The `--vers "0.2.100"` must match the version of
          # # `wasm-bindgen` in Cargo.toml file
          # cargo install wasm-bindgen-cli --vers "0.2.100"
          cargo +nightly build --package kobold_npm_lib_example \
            --bin main --target wasm32-unknown-unknown -Zdoctest-xcompile --verbose
          cargo check
          cargo fmt --check
      - name: Check in parent
        working-directory: ./
        run: |
          cargo check --features serde,stateful --workspace --all-targets --bins --examples
          cargo fmt --check

  miri:
    # needs: [checkfmt]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/base-setup
        # with:
        #   github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
      - name: Setup Miri
        working-directory: ./
        run: |
          # Source the retry script
          source ./.github/actions/retry-script/retry.sh
          MIRI_NIGHTLY=nightly-$(retry 10 curl -s https://rust-lang.github.io/rustup-components-history/x86_64-unknown-linux-gnu/miri)
          echo "Installing latest nightly with Miri: $MIRI_NIGHTLY"
          rustup set profile minimal
          rustup default "$MIRI_NIGHTLY"
          rustup component add miri
          cargo miri setup
      - name: Run Miri tests
        working-directory: ./crates/kobold
        run: |
          MIRIFLAGS='-Zmiri-strict-provenance' cargo miri test

  tests:
    # needs: [checkfmt, miri]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/base-setup
        # with:
        #   github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly

      # - name: Install wasm-pack
      #   run: |
      #     source $HOME/.cargo/env
      #     source ./.github/actions/retry-script/retry.sh
      #     retry 10 curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sudo sh

      - name: Test in package npm_lib
        working-directory: ./examples/npm_lib
        timeout-minutes: 10
        env:
          RUST_LOG: debug,wasm_bindgen_test_runner=trace
          WASM_BINDGEN_TEST_TIMEOUT: 120
          NODE_OPTIONS: "--max-old-space-size=4096 --trace-warnings"
        run: |
          source ../../.github/actions/retry-script/retry.sh

          export PATH="/usr/bin:$PATH"  # Ensure system binaries are in PATH
          echo "Installing JavaScript dependencies with Yarn"
          sudo yarn install --frozen-lockfile

          echo "Building JavaScript module with ESBuild"
          sudo mkdir -p output
          sudo chown -R $(id -u):$(id -g) .

          sudo yarn run esbuild
          ls -al output/

          echo "Installing Trunk with retries"
          retry 10 cargo install --locked trunk

          echo "Building using Trunk"
          RUST_LOG=debug trunk --config ./ build

          # echo "Installing wasm-bindgen-cli with retries"
          # # Note: The `--vers "0.2.100"` must match the version of `wasm-bindgen` in Cargo.toml file
          # retry 10 cargo install wasm-bindgen-cli --vers "0.2.100"

          echo "Building WASM package"
          wasm-pack build --target nodejs --dev
          ls -al pkg/

          echo "Verifying WASM module loading"
          node -e "
            const mod = require('./pkg/kobold_npm_lib_example.js');
            console.log('Module exports:', Object.keys(mod));
            if (!mod.default) console.warn('Warning: Module has no default export');
          "

          echo "Building and testing WASM package using cargo"
          cargo +nightly test --package kobold_npm_lib_example \
            --bin main --target wasm32-unknown-unknown -Zdoctest-xcompile --verbose

