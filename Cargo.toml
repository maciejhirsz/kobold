[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

# Temporarily disable broken crates
exclude = ["crates/kobold_router", "examples/csv_editor"]

[workspace.dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"

[profile.dev]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
