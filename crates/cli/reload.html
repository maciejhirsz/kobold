<style>
    .kobold-reload * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    .kobold-reload {
        position: absolute;
        bottom: 13px;
        left: calc(50vw);
        transform: translateX(-50%);
    }

    .kobold-reload .hide {
        display: none !important;
    }

    .kobold-reload .fail {
        width: 280px;
        padding: 10px;
        border-radius: 4px;
        background: #000c;
        color: #fff;
        font-family: sans-serif;
        font-size: 13px;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .kobold-reload .fail h3 {
        font-size: 16px;
        font-weight: bold;
    }

    .kobold-reload .fail p {
        width: 230px;
    }

    .kobold-reload .spin {
        position: relative;
        right: 13px;
        opacity: .3;
        animation: kobold-spin 2s infinite 0s linear;
    }

    @keyframes kobold-spin {
        from {
            transform: rotate(0turn);
        }

        to {
            transform: rotate(1turn);
        }
    }
</style>
<div class="kobold-reload">
    <div class="fail hide">
        <div>
            <h3>Build failed</h3>
            <p></p>
        </div>
        <svg width="36" height="36" version="1.1" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path fill="#fff"
                d="m4.5 1.8-2.7 2.7 3.5 3.5-3.5 3.5 2.7 2.7 3.5-3.5 3.5 3.5 2.7-2.7-3.5-3.5 3.5-3.5-2.7-2.7-3.5 3.5z" />
        </svg>
    </div>
    <div class="spin hide">
        <svg width="26" height="26" version="1.1" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path
                d="m12 14a2.4 2.4 0 0 0 1.9-1.2 2.4 2.4 0 0 0-0.86-3.2 2.4 2.4 0 0 0-3.2 0.86 2.4 2.4 0 0 0 0.86 3.2 2.4 2.4 0 0 0 1.3 0.31zm-8.4 0a2.4 2.4 0 0 0 1.3-0.31 2.4 2.4 0 0 0 0.86-3.2 2.4 2.4 0 0 0-3.2-0.86 2.4 2.4 0 0 0-0.86 3.2 2.4 2.4 0 0 0 1.9 1.2zm4.2-7.1a2.4 2.4 0 0 0 2.4-2.4 2.4 2.4 0 0 0-2.4-2.4 2.4 2.4 0 0 0-2.4 2.4 2.4 2.4 0 0 0 2.4 2.4z" />
        </svg>
    </div>
</div>
<script>
    (() => {
        const fail = document.querySelector('.kobold-reload .fail');
        const spin = document.querySelector('.kobold-reload .spin');

        const showSpinner = () => {
            fail.classList.add('hide');
            spin.classList.remove('hide');
        }

        const showMessage = msg => {
            fail.classList.remove('hide');
            spin.classList.add('hide');

            const p = fail.querySelector('p');
            p.innerHTML = msg;
        }

        const es = new EventSource('kobold-events');
        window.addEventListener('beforeunload', () => es.close());

        es.addEventListener('update', ev => {
            const msg = JSON.parse(ev.data);

            if (msg == 'wait') {
                showSpinner();
            } else if (msg == 'reload') {
                window.location.reload();
            } else if (msg.error) {
                showMessage(msg.error);
            }
        });
    })()
</script>
